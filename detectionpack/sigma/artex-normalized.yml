title: Sensor-Reported DNS Tunnel Heuristic
id: 7c89f13b-7497-4cc7-ae91-d8ca910da003
status: experimental
description: >
  A network sensor has classified traffic as possible DNS tunneling.
  Requires original packet or DNS telemetry and independent context.
logsource:
  category: artex_normalized
  product: artex-defense
detection:
  selection:
    kind: network
    action: dns_tunnel_suspected
  condition: selection
level: medium
falsepositives:
  - DNS security products, monitoring, and legitimate encoded DNS traffic.
tags:
  - attack.t1071.004
  - attack.ta0011
x_artex:
  disposition: alert_only
  false_positive_risk: high
  limitations: A vendor-generated heuristic alone is not command-and-control attribution.
  auto_containment_eligible: false
