# ARTEX-DEFENSE PR #12: local, reviewed Sigma-compatible normalized-event subset.
# These rules are NOT full Sigma support: one selection, exact matches or
# |contains/|startswith on normalized fields only. Alert-only; no sensor deploy.
title: Reported Security Agent Disablement
id: 9ab1e612-46ba-40bd-91d5-31d4ee36f001
status: experimental
description: >
  An enrolled sensor reports a security-agent stop or disable action; validate
  administrative change records and corroborate independently.
logsource:
  category: artex_normalized
  product: artex-defense
detection:
  selection:
    kind: endpoint
    action:
      - security_agent_disabled
      - edr_service_stopped
  condition: selection
level: medium
falsepositives:
  - Authorized upgrades, maintenance, and test deployments.
tags:
  - attack.t1685
  - attack.ta0112
x_artex:
  disposition: alert_only
  false_positive_risk: high
  limitations: A normalized action label does not independently prove tool tampering.
  auto_containment_eligible: false
---
