title: Reported Credential Dumping Heuristic
id: 41a367b9-f14d-4d30-96de-d28601f78004
status: experimental
description: >
  An enrolled endpoint sensor reports an action consistent with credential
  dumping; confirm process attribution and authorized forensic workflows.
logsource:
  category: artex_normalized
  product: artex-defense
detection:
  selection:
    kind: endpoint
    action: credential_dump_reported
  condition: selection
level: medium
falsepositives:
  - Authorized forensic acquisition and security validation tools.
tags:
  - attack.t1003
  - attack.ta0006
x_artex:
  disposition: alert_only
  false_positive_risk: high
  limitations: A vendor report is an unverified behavioral clue, not proof of stolen credentials.
  auto_containment_eligible: false
