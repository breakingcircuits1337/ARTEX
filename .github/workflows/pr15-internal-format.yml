name: pr15-internal-format
on:
  push:
    branches: [feat/pr15-ai-evidence-preview-safety-evaluations]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Go file formatting
        run: |
          for f in defense/ai_advisory.go defense/ai_safety.go defense/ai_safety_test.go server/defense_ai_advisory.go server/defense_ai_advisory_test.go server/server.go; do
            cp "$f" /tmp/pr15-original.go
            gofmt -w "$f"
            if ! cmp -s /tmp/pr15-original.go "$f"; then
              printf 'ARTEX15_FMT:%s:%s\n' "$f" "$(base64 -w0 "$f")"
            fi
          done
