name: tenant-evidence

on:
  pull_request:
    paths:
      - "db/migrations/0021_defense_tenant_correlation.sql"
      - "server/defense_telemetry.go"
      - "server/defense_collectors.go"
      - "server/defense_correlation.go"
      - "server/defense_tenant_correlation_test.go"
      - "server/defense_collectors_test.go"
      - "server/defense_graph*.go"
      - "server/defense_intelligence_api.go"
      - ".github/workflows/tenant-evidence.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/0021_defense_tenant_correlation.sql"
      - "server/defense_telemetry.go"
      - "server/defense_collectors.go"
      - "server/defense_correlation.go"
      - "server/defense_tenant_correlation_test.go"
      - "server/defense_collectors_test.go"
      - "server/defense_graph*.go"
      - "server/defense_intelligence_api.go"
      - ".github/workflows/tenant-evidence.yml"

permissions:
  contents: read

jobs:
  pg-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          files=$(gofmt -l server/defense_telemetry.go server/defense_collectors.go server/defense_collectors_test.go server/defense_correlation.go server/defense_tenant_correlation_test.go server/defense_graph.go server/defense_graph_correlation.go server/defense_intelligence_api.go)
          if [ -n "$files" ]; then echo "gofmt required: $files"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: Company isolation / sensor correlation
        run: go test -count=1 ./server -run 'Test(DefenseTenant|DefenseCrossSensor|Collector|ThreatCorrelation|DecodeDefenseCompany)'
      - name: SQL migrations
        run: go test -count=1 ./db -run 'Test(OpenMigratesFreshDatabase|Migrations)'
