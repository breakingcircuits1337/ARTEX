name: expanded-detection

on:
  pull_request:
    paths:
      - "detectionpack/**"
      - "defense/telemetry*.go"
      - "defense/correlation.go"
      - "server/defense_detection*.go"
      - "server/defense_telemetry.go"
      - "db/migrations/0022_defense_auth_guess_burst.sql"
      - ".github/workflows/expanded-detection.yml"
  push:
    branches: [main]
    paths:
      - "detectionpack/**"
      - "defense/telemetry*.go"
      - "defense/correlation.go"
      - "server/defense_detection*.go"
      - "server/defense_telemetry.go"
      - "db/migrations/0022_defense_auth_guess_burst.sql"
      - ".github/workflows/expanded-detection.yml"

permissions:
  contents: read

jobs:
  normalized-sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt guard
        run: |
          files=$(gofmt -l detectionpack/sigma.go detectionpack/sigma_test.go defense/correlation.go defense/telemetry.go defense/telemetry_sigma_test.go server/defense_detection_pack.go server/defense_detection_pr12_test.go server/defense_telemetry.go)
          if [ -n "$files" ]; then echo "gofmt required: $files"; exit 1; fi
      - name: Validate curated Sigma subset and ATT&CK allowlist
        run: go test -count=1 ./detectionpack ./defense
      - run: go build ./...
  pg-detection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Deterministic end-to-end detection fixtures
        run: go test -count=1 ./server -run 'TestPR12'
      - name: Fresh migration validation
        run: go test -count=1 ./db -run 'TestOpenMigratesFreshDatabase'
