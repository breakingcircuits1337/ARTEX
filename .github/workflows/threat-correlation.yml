name: threat-correlation

on:
  pull_request:
    paths:
      - "db/migrations/0017_defense_threat_correlation.sql"
      - "defense/correlation*.go"
      - "server/defense_correlation*.go"
      - "server/defense_graph_correlation.go"
      - "server/defense_intelligence_api.go"
      - "server/defense_workflow.go"
      - "server/defense_graph.go"
      - "server/server.go"
      - "web/src/app/(main)/function/defense/cases/**"
      - ".github/workflows/threat-correlation.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/0017_defense_threat_correlation.sql"
      - "defense/correlation*.go"
      - "server/defense_correlation*.go"
      - "server/defense_graph_correlation.go"
      - "server/defense_intelligence_api.go"
      - ".github/workflows/threat-correlation.yml"

jobs:
  correlation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format guard for all added correlation Go sources
        run: |
          files=$(gofmt -l defense/correlation.go defense/correlation_test.go server/defense_correlation.go server/defense_correlation_test.go server/defense_intelligence_api.go server/defense_graph_correlation.go)
          if [ -n "$files" ]; then printf 'gofmt required:\n%s\n' "$files"; exit 1; fi
      - name: Compile every Go package
        run: go build ./...
      - name: Run pure correlation and DB-integrity tests
        run: >-
          go test -count=1 ./defense ./server
          -run 'Test(CaseIndicators|ATTACK|OnlyReviewed|CorrelationRead|ThreatCorrelation|IndicatorCrossCase|IntelligenceEndpoints)'
      - name: Run SQL migration tests
        run: go test -count=1 ./db -run 'TestOpen(MigratesFreshDatabase|RecordsEmbeddedMigrations)'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
