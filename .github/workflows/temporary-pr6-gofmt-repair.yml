name: temporary-pr6-gofmt-repair
# One-shot formatting fix for this feature branch. Remove after use.
on:
  push:
    branches:
      - feature/phase6-threat-correlation-graph

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'breakingcircuits1337/ARTEX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt on tracked Go files and commit the exact diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/phase6-threat-correlation-graph"
          mapfile -t paths < <(git ls-files '*.go')
          gofmt -w "${paths[@]}"
          if git diff --quiet -- '*.go'; then
            echo 'All sources already gofmt-clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go'
          git diff --cached --stat
          git commit -m 'chore(go): format Phase 6 correlation code'
          git push origin HEAD:refs/heads/feature/phase6-threat-correlation-graph
