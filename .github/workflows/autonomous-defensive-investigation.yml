name: autonomous-defensive-investigation

on:
  pull_request:
    paths:
      - "db/migrations/0018_defense_autonomous_investigation.sql"
      - "defense/investigator*.go"
      - "server/defense_investigation*.go"
      - "server/defense_intelligence_api.go"
      - "server/defense_workflow.go"
      - "server/defense_graph.go"
      - "server/server.go"
      - "web/src/app/(main)/function/defense/intelligence/**"
      - ".github/workflows/autonomous-defensive-investigation.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/0018_defense_autonomous_investigation.sql"
      - "defense/investigator*.go"
      - "server/defense_investigation*.go"
      - ".github/workflows/autonomous-defensive-investigation.yml"

jobs:
  investigator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify gofmt on every new investigation source file
        run: |
          files=$(gofmt -l defense/investigator.go defense/investigator_test.go server/defense_investigation_worker.go server/defense_investigation_api.go server/defense_investigation_graph.go server/defense_investigation_test.go)
          if [ -n "$files" ]; then printf 'gofmt required:\n%s\n' "$files"; exit 1; fi
      - name: Compile all Go packages
        run: go build ./...
      - name: Check Go vet
        run: go vet ./...
      - name: Verify deterministic safety and PostgreSQL integration
        run: >-
          go test -count=1 ./defense ./server
          -run 'Test(AnalyzeInvestigation|DefensiveInvestigator|InvestigationHuman|InvestigationQueue)'
      - name: Verify fresh database migrations
        run: go test -count=1 ./db -run 'TestOpenMigratesFreshDatabase'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
