name: temporary-pr5-gofmt-repair
# Temporary one-branch formatting repair: remove before merging PR #5.
on:
  push:
    branches:
      - feature/phase5-detection-pack

permissions:
  contents: write

jobs:
  gofmt:
    if: github.repository == 'breakingcircuits1337/ARTEX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format all tracked Go files and commit exact gofmt changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/phase5-detection-pack"
          mapfile -t paths < <(git ls-files '*.go')
          gofmt -w "${paths[@]}"
          if git diff --quiet -- '*.go'; then
            echo 'All Go sources already gofmt-clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go'
          git diff --cached --stat
          git commit -m 'chore(go): apply gofmt to tracked sources for strict existing CI gate'
          git push origin HEAD:refs/heads/feature/phase5-detection-pack
