name: container-security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      scan_image:
        description: "Build and scan the complete runtime image before publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compose-isolation:
    name: compose-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Validate Docker Compose runtime configuration
        run: python3 scripts/test_container_hardening.py

  image-audit:
    name: runtime-image-audit
    # Expensive: mandatory in release.yml via workflow_call scan_image=true,
    # optional manual validation, not repeated for every code-only PR.
    if: ${{ inputs.scan_image == true || github.event_name == 'workflow_dispatch' }}
    needs: compose-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build actual Linux runtime image before publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: artex-defense:qualification
          build-args: ARTEX_VERSION=qualification
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Use a single independently pinned upstream artifact rather than
      # trivy-action's mutable tag and action dependency chain. The recorded
      # digest was checked against GitHub's v0.76.2 release asset metadata.
      - name: Install checksum-pinned Trivy v0.76.2
        env:
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          chmod +x "$RUNNER_TEMP/trivy"
          "$RUNNER_TEMP/trivy" --version
      - name: Fail on fixable HIGH/CRITICAL runtime image vulnerabilities
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/trivy" image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 45m \
            --format table \
            --output "$RUNNER_TEMP/runtime-vulns.txt" \
            artex-defense:qualification; then
            cat "$RUNNER_TEMP/runtime-vulns.txt"
            echo "::error::The runtime image has fixable HIGH/CRITICAL vulnerabilities"
            exit 1
          fi
          cat "$RUNNER_TEMP/runtime-vulns.txt"
      - name: Retain image vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-vulnerability-report
          path: ${{ runner.temp }}/runtime-vulns.txt
          if-no-files-found: warn
