name: realtime-soc

on:
  pull_request:
    paths:
      - "db/migrations/0019_defense_soc_monitoring.sql"
      - "server/defense_realtime*.go"
      - "server/server.go"
      - "web/src/app/(main)/function/defense/**"
      - ".github/workflows/realtime-soc.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/0019_defense_soc_monitoring.sql"
      - "server/defense_realtime*.go"
      - ".github/workflows/realtime-soc.yml"

jobs:
  soc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go formatting guard
        run: |
          files=$(gofmt -l server/defense_realtime.go server/defense_realtime_test.go)
          if [ -n "$files" ]; then printf 'gofmt required:\n%s\n' "$files"; exit 1; fi
      - name: Full Go compilation
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Test SOC endpoints and Postgres integration
        run: go test -count=1 ./server -run 'TestSOC'
      - name: Check fresh schema migrations including 0019
        run: go test -count=1 ./db -run 'TestOpenMigratesFreshDatabase'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
