name: temporary-pr6-format-final
on:
  push:
    branches: [feature/phase6-threat-correlation-graph]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'breakingcircuits1337/ARTEX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Canonically format modified Phase 6 tests and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/phase6-threat-correlation-graph"
          gofmt -w server/defense_correlation_test.go
          if git diff --quiet -- server/defense_correlation_test.go; then
            echo "already format-clean"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/defense_correlation_test.go
          git diff --cached --check
          git commit -m 'style(defense): gofmt strict PostgreSQL regression tests'
          git push origin HEAD:refs/heads/feature/phase6-threat-correlation-graph
