name: bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  reply:
    # Issue opening is always handled (the maintainer gets silent labeling,
    # visitors get the full triage). Comments and PRs serve visitors only:
    # never react to the maintainer, to bots, or to itself.
    if: >
      github.event_name == 'issues' ||
      (github.actor != github.repository_owner &&
       github.actor != 'github-actions[bot]' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: triage or reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash .github/scripts/bot.sh
