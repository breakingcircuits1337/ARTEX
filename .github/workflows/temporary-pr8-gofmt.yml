name: temporary-pr8-gofmt
# One-shot, branch-scoped formatter; delete after it commits.
on:
  push:
    branches: [feature/phase8-realtime-soc]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'breakingcircuits1337/ARTEX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Canonically format new monitoring source, commit and push to PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/phase8-realtime-soc"
          gofmt -w server/defense_realtime.go server/defense_realtime_test.go
          if git diff --quiet -- server/defense_realtime.go server/defense_realtime_test.go; then
            echo "already gofmt-clean"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/defense_realtime.go server/defense_realtime_test.go
          git diff --cached --check
          git commit -m 'style(defense): canonical gofmt for realtime SOC monitoring'
          git push origin HEAD:refs/heads/feature/phase8-realtime-soc
