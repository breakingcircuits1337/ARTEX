name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  schedule:
    - cron: '17 4 * * 3'

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: go-vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Block reachable Go vulnerabilities
        # Pin the scanner release; do not suppress a detected vulnerability.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  node-vulnerabilities:
    name: node-vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Block high and critical production npm advisories
        run: npm audit --omit=dev --audit-level=high
